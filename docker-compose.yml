services:
  dropfarm:
    build: .
    image: dropfarm:local
    container_name: dropfarm
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      ACCOUNTS_FILE: /data/accounts.txt
      LOG_DIR: /data/logs
    volumes:
      - ./data:/data
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
